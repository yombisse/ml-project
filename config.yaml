# ==============================================================================
# PROJECT CONFIGURATION
# ==============================================================================

project:
  name: "Heart Disease Prediction"
  version: "1.0.0"
  description: "ML Classification project for Heart Disease prediction"
  author: "Étudiant IFOAD"
  date: "2026-05-13"

# ==============================================================================
# DATA CONFIGURATION
# ==============================================================================

data:
  raw_path: "data/raw/processed.cleveland.data"
  processed_path: "data/processed/heart_disease_cleaned.csv"
  
  # Dataset columns
  columns:
    - age
    - sex
    - cp
    - trestbps
    - chol
    - fbs
    - restecg
    - thalach
    - exang
    - oldpeak
    - slope
    - ca
    - thal
    - target
  
  # Target variable
  target: "target"
  target_type: "binary"
  
  # Test-train split ratio
  test_size: 0.2
  random_state: 42

# ==============================================================================
# PREPROCESSING CONFIGURATION
# ==============================================================================

preprocessing:
  # Handling missing values
  handle_missing: true
  missing_strategy: "drop"  # drop, mean, median, mode
  
  # Normalization/Standardization
  scaling: true
  scaler_type: "StandardScaler"  # StandardScaler, MinMaxScaler
  
  # Categorical encoding
  encoding_type: "one_hot"  # one_hot, label
  
  # Feature selection
  feature_selection: false
  n_features: null

# ==============================================================================
# MODEL CONFIGURATION
# ==============================================================================

models:
  logistic_regression:
    name: "Logistic Regression"
    hyperparameters:
      max_iter: 1000
      random_state: 42
      solver: "lbfgs"
  
  svm:
    name: "Support Vector Machine"
    hyperparameters:
      kernel: "rbf"
      C: 1.0
      random_state: 42
  
  decision_tree:
    name: "Decision Tree"
    hyperparameters:
      max_depth: 10
      min_samples_split: 5
      random_state: 42
  
  random_forest:
    name: "Random Forest"
    hyperparameters:
      n_estimators: 100
      max_depth: 10
      random_state: 42
      n_jobs: -1
  
  gradient_boosting:
    name: "Gradient Boosting"
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      random_state: 42
  
  knn:
    name: "K-Nearest Neighbors"
    hyperparameters:
      n_neighbors: 5
      weights: "uniform"
      metric: "euclidean"

# ==============================================================================
# EVALUATION CONFIGURATION
# ==============================================================================

evaluation:
  # Metrics to compute
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "confusion_matrix"
  
  # Cross-validation
  cv_folds: 5
  
  # Class weights
  class_weight: "balanced"

# ==============================================================================
# STREAMLIT APP CONFIGURATION
# ==============================================================================

streamlit:
  # App settings
  page_title: "Heart Disease Prediction"
  page_icon: "🏥"
  layout: "wide"
  
  # Sidebar configuration
  show_sidebar: true
  
  # Theme
  theme: "light"  # light, dark
  
  # Port
  port: 8501

# ==============================================================================
# PATHS AND DIRECTORIES
# ==============================================================================

paths:
  root: "."
  data: "data"
  notebooks: "notebooks"
  src: "src"
  streamlit_app: "streamlit_app"
  models: "streamlit_app/models"
  
  # Logs and outputs
  logs: "logs"
  outputs: "outputs"

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5
