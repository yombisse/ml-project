project:
  name: "Heart Disease Prediction"
  version: "1.0.0"
  description: "ML classification project for Heart Disease prediction"
  author: "Etudiant IFOAD"
  date: "2026-05-13"

data:
  raw_path: "data/raw/processed.cleveland.data"
  processed_path: "data/processed/heart_disease_cleaned.csv"
  columns:
    - age
    - sex
    - cp
    - trestbps
    - chol
    - fbs
    - restecg
    - thalach
    - exang
    - oldpeak
    - slope
    - ca
    - thal
    - target
  target: "target"
  target_type: "binary"
  test_size: 0.2
  random_state: 42

preprocessing:
  handle_missing: true
  missing_strategy_numeric: "median"
  missing_strategy_categorical: "most_frequent"
  scaling: true
  scaler_type: "StandardScaler"
  encoding_type: "one_hot"
  numeric_features:
    - age
    - trestbps
    - chol
    - thalach
    - oldpeak
  categorical_features:
    - sex
    - cp
    - fbs
    - restecg
    - exang
    - slope
    - ca
    - thal

models:
  logistic_regression:
    name: "Logistic Regression"
    hyperparameters:
      max_iter: 1000
      random_state: 42
      solver: "liblinear"

  knn:
    name: "K-Nearest Neighbors"
    hyperparameters:
      n_neighbors: 7
      weights: "distance"
      metric: "minkowski"

  svm:
    name: "Support Vector Machine"
    hyperparameters:
      kernel: "rbf"
      C: 1.0
      gamma: "scale"
      probability: true
      random_state: 42

  decision_tree:
    name: "Decision Tree"
    hyperparameters:
      max_depth: 5
      min_samples_split: 4
      random_state: 42

  random_forest:
    name: "Random Forest"
    hyperparameters:
      n_estimators: 200
      max_depth: 8
      min_samples_split: 4
      random_state: 42
      n_jobs: 1

  adaboost:
    name: "AdaBoost"
    hyperparameters:
      n_estimators: 150
      learning_rate: 0.8
      random_state: 42

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
  cv_folds: 5
  scoring_primary: "roc_auc"

streamlit:
  page_title: "Heart Disease Prediction"
  page_icon: "❤️"
  layout: "wide"
  show_sidebar: true
  theme: "light"
  port: 8501
  assets_images_path: "assets/images"

auth:
  enabled: true
  demo_user:
    email: "IFOAD@gmail.com"
    password: "Heart123"

paths:
  root: "."
  data: "data"
  notebooks: "notebooks"
  src: "src"
  streamlit_app: "streamlit_app"
  models: "models"
  logs: "logs"
  outputs: "outputs"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  files:
    app: "logs/app.log"
    pipeline: "logs/training.log"
    training: "logs/training.log"
    evaluation: "logs/evaluation.log"
    streamlit: "logs/streamlit.log"
  max_file_size: 1048576
  backup_count: 3
